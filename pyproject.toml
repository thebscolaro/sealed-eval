[project]
name = "sealed-eval"
version = "0.3.1"
description = "Sealed evaluation control plane for coding agents — grade running artifacts outside the coder's reach"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "SEALed-eval contributors" }]
keywords = ["agents", "evaluation", "sealed", "llm", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "python-multipart>=0.0.12",
  "typer>=0.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
  "bandit>=1.8.0",
  "pip-audit>=2.7.0",
  "build>=1.2.0",
]
ui = [
  "playwright>=1.49.0",
]

[project.urls]
Homepage = "https://github.com/thebscolaro/sealed-eval"
Documentation = "https://github.com/thebscolaro/sealed-eval/blob/main/docs/RUNBOOK.md"
Issues = "https://github.com/thebscolaro/sealed-eval/issues"
Changelog = "https://github.com/thebscolaro/sealed-eval/blob/main/CHANGELOG.md"

[project.scripts]
sealed-eval = "sealed_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sealed_eval"]

[tool.hatch.build.targets.sdist]
include = [
  "src/sealed_eval",
  "fixtures",
  "subject-demo",
  "docs",
  "agents",
  "scripts",
  "SPEC.md",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
