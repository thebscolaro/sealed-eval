services:
  harness:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - ./sealed:/app/sealed
    command: ["sealed-eval", "serve", "--host", "0.0.0.0", "--port", "8787"]

  subject-demo:
    build: .
    ports:
      - "8080:8080"
    command:
      [
        "uvicorn",
        "app:app",
        "--app-dir",
        "subject-demo",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
      ]
